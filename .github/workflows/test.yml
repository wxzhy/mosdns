name: Test mosdns

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -race -v ./...

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: arm64
            gomips: ""
          - arch: mipsle
            gomips: softfloat
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Linux / OpenWrt targets
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          GOMIPS: ${{ matrix.gomips }}
          CGO_ENABLED: "0"
        run: go build ./...
