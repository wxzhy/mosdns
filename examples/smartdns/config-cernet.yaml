# Migrated from smartdns-test/config-cernet.yaml; SHA256 95a23678176be2a1af397ad69ea8e6888e5f2b47abf19547e4e7aa263e42ebca
# Generated by scripts/migrate_smartdns_configs.py; see docs/smartdns-migration.md.
# Run from the mosdns repository root after exporting data/smartdns.
# Contains the original private deployment endpoints; review before sharing.
# ICMP-only probes preserve the old configuration and require ICMP capability.
log:
  level: info
  file: /var/log/mosdns.log

# 域名直接使用 geosite:标签，默认库为导出的 runtime 兼容 bundle。
# 不要用原始 GeoSite dat 替换它而声称匹配语义不变；typed 模式是另行选择的语义调整。
geodata:
  geosite: ./data/smartdns/geosite.dat
  geoip: ./data/smartdns/Country.mmdb
  asn: ./data/smartdns/ASN.mmdb
plugins:

# 示例基础功能：仅在主入口最前方统计，包含缓存命中；不统计 HTTPS 辅助查询。
# 正常关闭及定时转储保留统计，普通/CERNET 使用各自文件，避免切换配置时混用。
- tag: stats_collector
  type: stats_api
  args:
    capacity: 2000
    dump_file: /etc/mosdns/stats-cernet.dump
    dump_interval: 600

# IP 集合保留原标签：GeoIP/ASN 使用上面的默认库；GitHub 两个自定义集合仍读原导出文本。
- tag: ip_cloudflare
  type: ip_set
  args:
    ips:
    - geoip:cloudflare
- tag: ip_cloudfront
  type: ip_set
  args:
    ips:
    - geoip:cloudfront
- tag: ip_fastly
  type: ip_set
  args:
    ips:
    - geoip:fastly
- tag: ip_private
  type: ip_set
  args:
    ips:
    - geoip:private
- tag: ip_facebook
  type: ip_set
  args:
    ips:
    - geoip:facebook
- tag: ip_twitter
  type: ip_set
  args:
    ips:
    - geoip:twitter
- tag: ip_github
  type: ip_set
  args:
    files:
    - ./data/smartdns/ips/github.txt
- tag: ip_github-raw
  type: ip_set
  args:
    files:
    - ./data/smartdns/ips/github-raw.txt
- tag: ip_asn_19679
  type: ip_set
  args:
    ips:
    - asn:19679
- tag: ip_asn_33191
  type: ip_set
  args:
    ips:
    - asn:33191

