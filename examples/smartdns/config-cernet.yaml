    selection_timeout: 300ms
    settle_window: 25ms
    probe: *id001
    max_num: 1
    threshold_ms: 100
    labels: *id002
    tag_multipliers: *id003
    asn_multipliers: *id004
    probe_match: *id005

# 以下路由保留原 ECS 设置、标记和上游选择方式。
# 标记编号：1=block 2=proxy 3=google-cn 4=cn 5=global 6=opennic 7=default；
# main 依据这些标记为 SVCB/HTTPS 查询选择对应的后处理动作。
- tag: google_ecs
  type: ecs_handler
  args:
    forward: false
    send: false
    preset: '240b:4001:23c::'
    mask6: 48

# 非测速上游池：forward 并发竞速，取第一份完整应答，不做逐候选测速；
# route_google_cn 先调用 google_ecs 注入 ECS，再查询此池。
- tag: upstream_google_cn
  type: forward
  args:
    concurrent: 2
    upstreams:
    - addr: udp://[2001:4860:4860::8888]:53
      repeat: 0
      use_tricks: true
    - addr: udp://[2001:4860:4860::8844]:53
      repeat: 0
      use_tricks: true
- tag: upstream_opennic
  type: forward
  args:
    concurrent: 2
    upstreams:
    - addr: tcp://[2a01:4f9:2b:1305::2]:53
    - addr: tcp://[2a01:4f9:c011:83d::1]:53
- tag: route_google_cn
  type: sequence
  args:
  - exec: mark 3
  - exec: $google_ecs
  - exec: $upstream_google_cn
- tag: route_cn
  type: sequence
  args:
  - exec: mark 4
  - exec: $select_cn
- tag: route_global
  type: sequence
  args:
  - exec: mark 5
  - exec: $select_global
  - exec: $apply_fallback
- tag: route_opennic
  type: sequence
  args:
  - exec: mark 6
  - exec: $upstream_opennic
- tag: route_default
  type: sequence
  args:
  - exec: mark 7
  - exec: $select_default
  - exec: $apply_fallback
- tag: route_block
  type: sequence
  args:
  - exec: mark 1
  - exec: $static_block
- tag: route_proxy
  type: sequence
  args:
  - exec: mark 2
  - exec: $static_proxy

# 保留原分流顺序：广告 → proxy（A/AAAA）→ google-cn → 国内 → 全局 → OpenNIC → 默认。
# 每段 has_resp 后立即 accept；合法 NXDOMAIN 也是响应，不能按“没有地址”继续落入默认路由。
- tag: resolve_base
  type: sequence
  args:
  - matches:
    - qname geosite:category-ads-all geosite:category-ads geosite:ads
    exec: $route_block
  - matches:
    - has_resp
    exec: accept
  - matches:
    - qname geosite:proxy
    - qtype 1 28
    exec: $route_proxy
  - matches:
    - has_resp
    exec: accept
  - matches:
    - qname geosite:google-cn
    exec: $route_google_cn
  - matches:
    - has_resp
    exec: accept
  - matches:
    - qname geosite:cn geosite:google-cn geosite:apple-cn
    exec: $route_cn
  - matches:
    - has_resp
    exec: accept
  - matches:
    - qname geosite:google geosite:gfw
    exec: $route_global
  - matches:
    - has_resp
    exec: accept
  - matches:
    - qname geosite:tld-opennic
    exec: $route_opennic
  - matches:
    - has_resp
    exec: accept
  - exec: $route_default
  - matches:
    - has_resp
    exec: accept

# 复用迁移配置原有的共享缓存，合入示例的容量、lazy 保留期及持久化。
# 普通/CERNET 使用不同转储文件；过期命中以 TTL 5 秒返回并后台刷新。
# cache 会包裹后续链，在链执行完后保存最终响应，包括 HTTPS 后处理结果。
- tag: response_cache
  type: cache
  args:
    size: 20000
    lazy_cache_ttl: 86400
    dump_file: /etc/mosdns/cache-cernet.dump
    dump_interval: 600

# HTTPS 的辅助 A 查询复用缓存和完整分流、过滤、替换、测速链。
# 此入口不执行 main 的 HTTPS 后处理，避免递归；也不能直接改成裸 forward 绕过策略。
- tag: resolve_cached
  type: sequence
  args:
  - exec: $response_cache
  - matches:
    - has_resp
    exec: accept
  - exec: $resolve_base

# ECH 查询使用独立上游池，与辅助 IP 解析的完整策略链分开。
- tag: ech_lookup
  type: forward
  args:
    concurrent: 2
    upstreams:
    - addr: udp://114.114.114.114:53
    - addr: udp://114.114.115.115:53

# HTTPS 名称门控控制注入和辅助查询；即使跳过它们，后面的 hint/H3 清理仍执行。
# 因此 inject_* 与 apply_* 两层不能直接合并成同一个带名称条件的动作。
- tag: https_cleanup
  type: https_record
  args:
    remove_hint: true
    remove_h3: true
    add_ech: false
    enable_subquery: false

# HTTPS 后处理参数：match_ip 门控注入对象（应答地址命中这些集合才注入 ECH）。
# add_ech 开启且满足注入条件时，ech_source 通过独立上游池查询 ech_domain。
# enable_subquery 另行控制辅助 A 查询；ip_source 使用 resolve_cached 完整策略链。
- tag: process_https
  type: https_record
  args:
    remove_hint: true
    remove_h3: true
    add_ech: true
    enable_subquery: true
    ech_source: ech_lookup
    ech_domain: crypto.cloudflare.com
    ip_source: resolve_cached
    match_ip:
    - $ip_cloudflare
    timeout: 500ms
- tag: inject_https
  type: sequence
  args:
  - matches:
    - qname geosite:cn
    exec: return
  - matches:
    - cname geosite:cn
    exec: return
  - exec: $process_https
- tag: apply_https
  type: sequence
  args:
  - exec: $inject_https
  - exec: $https_cleanup

# 总入口：先统计，再查共享缓存，未命中按原策略分流；非 NOERROR 响应不执行 HTTPS 后处理。
# SVCB/HTTPS 按原路由标记执行对应动作，保留各条规则及其顺序；缓存命中不重复处理。
- tag: main
  type: sequence
  args:
  - exec: $stats_collector
  - exec: $response_cache
  - matches:
    - has_resp
    exec: accept
  - exec: $resolve_base
  - matches:
    - '!rcode 0'
    exec: accept
  - matches:
    - qtype 64 65
    - mark 3
    exec: $apply_https
  - matches:
    - qtype 64 65
    - mark 4
    exec: $apply_https
  - matches:
    - qtype 64 65
    - mark 5
    exec: $apply_https
  - matches:
    - qtype 64 65
    - mark 7
    exec: $apply_https

# TCP/UDP 监听器共用 main，监听地址和端口保留原配置。
- tag: dns_tcp
  type: tcp_server
  args:
    entry: main
    listen: '[::]:5335'
    idle_timeout: 5
- tag: dns_udp
  type: udp_server
  args:
    entry: main
    listen: '[::]:5335'
api:
  http: 127.0.0.1:9091
include: []
