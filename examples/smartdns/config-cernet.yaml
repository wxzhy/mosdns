- tag: select_global
  type: speedcheck
  args:
    sources:
    - source_global__doh-test__1
    - source_global__nextdns__1
    - source_global__nextdns__2
    mode: wait_all
    total_timeout: 5s
    selection_timeout: 300ms
    settle_window: 25ms
    probe: *id001
    max_num: 1
    threshold_ms: 100
    labels: *id002
    tag_multipliers: *id003
    asn_multipliers: *id004
    probe_match: *id005
