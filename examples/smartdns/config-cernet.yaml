# 各组 selector 保留原候选顺序、mode 和超时；不能用先选一份响应的 forward 池代替。
# probe/labels/倍率配置以锚点共享；修改锚点影响其引用，单组调整时先展开对应别名。
# private 只豁免探测，不代表丢弃该地址；其余地址在过滤和替换完成后才进入测速。
- tag: select_cn
  type: speedcheck
  args:
    sources:
    - source_cn__telecom__1
    - source_cn__telecom__2
    - source_cn__unicom__1
    - source_cn__unicom__2
    - source_cn__cmcc__1
    - source_cn__cmcc__2
    - source_cn__dnspod__1
    - source_cn__dnspod__2
    - source_cn__114dns__1
    - source_cn__114dns__2
    mode: wait_all
    total_timeout: 2s
    selection_timeout: 300ms
    settle_window: 25ms
    probe: &id001
      tcp_ports: []
      icmp: true
      timeout: 300ms
    max_num: 1
    threshold_ms: 100
    labels: &id002
      private:
      - $ip_private
    tag_multipliers: &id003 []
    asn_multipliers: &id004 {}
    probe_match: &id005
      labels_exclude:
      - private
- tag: source_global__doh-test__1
  type: sequence
  args:
  - exec: $upstream_curl-doh_1
  - exec: $apply_replace
  - matches:
    - '!has_resp'
    exec: return
- tag: source_global__nextdns__1
  type: sequence
  args:
