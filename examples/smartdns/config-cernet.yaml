# 静态路由：A/AAAA 返回配置地址；其他类型保持 NOERROR/NODATA。
# black_hole 后的 has_resp/accept 与 reject 0 不能省略，否则会继续落到其他路由。
- tag: static_block
  type: sequence
  args:
  - exec: black_hole 127.0.0.1 ::1
  - matches:
    - has_resp
    exec: ttl 86400
  - matches:
    - has_resp
    exec: accept
  - exec: reject 0
- tag: static_proxy
  type: sequence
  args:
  - exec: black_hole 192.168.8.64 2001:db8::64
  - matches:
    - has_resp
    exec: ttl 86400
  - matches:
    - has_resp
    exec: accept
  - exec: reject 0

# CDN 替换保留 replace_map 原顺序，GitHub raw 的例外须先于 Fastly 的宽泛集合。
# Fastly 的 IPv4 /22、IPv6 /64 替换保留主机位，不能改成逐地址的 /32、/128。
- tag: replace_cdn
  type: ip_replace
  args:
    replace_map:
    - match_ip:
      - $ip_cloudflare
      exclude_ip: []
      ipv4_prefixlen: 32
      ipv6_prefixlen: 128
      ipv4:
      - 172.64.145.0
      - 172.64.146.0
      - 104.18.38.0
      - 104.18.39.0
      ipv6:
      - '2606:4700:10::'
      - '2606:4700:20::'
    - match_ip:
      - $ip_cloudfront
      exclude_ip: []
      ipv4_prefixlen: 32
      ipv6_prefixlen: 128
      ipv4:
      - 3.168.241.0
      - 13.225.167.0
      - 3.175.219.0
      - 13.33.212.0
      - 3.166.246.0
      ipv6:
      - '2600:9000:2939::'
      - '2600:9000:2079::'
    - match_ip:
      - $ip_github-raw
      exclude_ip: []
      ipv4_prefixlen: 32
      ipv6_prefixlen: 128
      ipv4:
      - 146.75.50.132
      - 146.75.49.55
      - 146.75.48.133
      - 146.75.50.217
      - 146.75.49.91
      ipv6:
      - 2a04:4e42:200::133
      - 2a04:4e42:400::311
      - 2a04:4e42:600::347
    - match_ip:
      - $ip_fastly
      exclude_ip:
      - $ip_github
      ipv4_prefixlen: 22
      ipv6_prefixlen: 64
      ipv4:
      - 146.75.48.0
      ipv6:
      - '2a04:4e42:200::'
      - '2a04:4e42:400::'
      - '2a04:4e42:600::'

# 替换门控：豁免名单同时检查 qname 和 CNAME，仅 A/AAAA（1/28）参与地址替换；
# 各名单内容与先后顺序均取自原配置。
- tag: apply_replace
  type: sequence
  args:
  - matches:
    - qname geosite:mozilla geosite:cn geosite:cloudflare-cn geosite:google-cn geosite:category-ntp geosite:category-stun
    exec: return
  - matches:
    - cname geosite:mozilla geosite:cn geosite:cloudflare-cn geosite:google-cn geosite:category-ntp geosite:category-stun
    exec: return
  - matches:
    - '!qtype 1 28'
    exec: return
  - exec: $replace_cdn
- tag: filter_item_1
  type: sequence
  args:
  - matches:
    - qname geosite:facebook geosite:dropbox
    exec: return
  - matches:
    - cname geosite:facebook geosite:dropbox
    exec: return
  - matches:
    - resp_ip $ip_facebook $ip_twitter $ip_asn_19679
    exec: drop_resp

# 命中过滤条件时丢弃整份响应，不是仅删去一个地址；名称豁免同时检查 qname/CNAME。
# 每项过滤后保留 !has_resp 返回，阻止被丢弃的候选继续参与替换和测速。
- tag: filter_response
  type: sequence
  args:
  - exec: $filter_item_1
  - matches:
    - '!has_resp'
    exec: return

# 固定地址兜底仅接受 all_probes_failed 或合法 NODATA。
# unmeasured（未启动、取消或不支持）不等于测速失败；NXDOMAIN 也不等于 NODATA。
- tag: fallback_google
  type: ip_fallback
  args:
    ipv4: []
    ipv6:
    - 2404:6800:4005:800::93
    - 2404:6800:4005:c02::94
    - 2404:6800:4005:c00::2008
    - 2404:6800:4005:c02::2018
    - 2404:6800:4005:c02::ca
    - 2404:6800:4005:800::b5
    ttl: 86400
    'on':
    - all_probes_failed
    - nodata

# 名称包含/排除门控保持原顺序，同时检查 qname 和 CNAME；仅在对应路由完成选择后调用。
- tag: apply_fallback
  type: sequence
  args:
  - matches:
    - qname geosite:google-cn geosite:googlefcm geosite:category-ntp geosite:category-stun
    exec: return
  - matches:
    - cname geosite:google-cn geosite:googlefcm geosite:category-ntp geosite:category-stun
    exec: return
  - matches:
    - '!qname geosite:google'
    - '!cname geosite:google'
    exec: return
  - exec: $fallback_google

# source_<路由组>__<上游组>__<序号>：候选来源保持各 resolver 的原动作顺序，
# 即 上游应答 →（按原配置）全响应过滤 → CDN 替换 → 其他替换，随后交给同组 selector。
# 任一步之后无响应立即 return 结束该候选，不对原地址先测速。
- tag: source_cn__telecom__1
  type: sequence
  args:
  - exec: $upstream_telecom_1
  - exec: $filter_response
  - matches:
