# Windows 最小 speedcheck 示例：仅用 TCP 80/443 探测，无需原始套接字权限。
# 平台差异与 ICMP 说明见 docs/speedcheck-windows.md，完整流程见 speedcheck.yaml。
# 上游地址请替换为本网络可达的 DNS 服务器。
log:
  level: info

plugins:
  # 一上游一 forward：forward 内部竞速会提前丢弃其他响应，见 docs/speedcheck.md。
  - tag: upstream_a
    type: forward
    args:
      upstreams:
        - addr: "udp://1.1.1.1"
  - tag: upstream_b
    type: forward
    args:
      upstreams:
        - addr: "udp://8.8.8.8"

  # 来源用 sequence 包一层，供 speedcheck 并行调度。
  - tag: source_a
    type: sequence
    args:
      - exec: $upstream_a
  - tag: source_b
    type: sequence
    args:
      - exec: $upstream_b

  - tag: select_fast_ip
    type: speedcheck
    args:
      sources: [source_a, source_b]   # 并行查询，按探测得分选优
      mode: bounded                   # 首个合格正答后限时收尾
      total_timeout: 5s
      selection_timeout: 300ms
      settle_window: 25ms
      probe:
        tcp_ports: [80, 443]          # Windows 下 TCP 探测即可工作
        icmp: false                   # true 启用 raw ICMP，启动时检查能力；是否需提升权限取决于系统
        timeout: 300ms
      max_num: 1
      threshold_ms: 100

  - tag: main
    type: sequence
    args:
      - exec: $select_fast_ip
      - exec: accept

  - tag: udp_listener
    type: udp_server
    args:
      entry: main
      listen: "127.0.0.1:15353"
  - tag: tcp_listener
    type: tcp_server
    args:
      entry: main
      listen: "127.0.0.1:15353"
